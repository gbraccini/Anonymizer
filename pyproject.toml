[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer"
version = "0.1.0"
description = "Reviewable clinical document pseudonymization"
requires-python = ">=3.12"
license = "LicenseRef-Anonymizer-Personal-Use"
license-files = ["LICENSE"]
authors = [{ name = "Gianluca Braccini", email = "gianluca.braccini@gmail.com" }]
dependencies = []

[project.scripts]
anonymizer = "anonymizer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pypdf>=6", "pillow-heif>=1.8"]
visual = ["pypdfium2>=4.30", "Pillow>=11", "pi-heif>=1.4", "reportlab>=4.2"]
ocr = ["pypdfium2>=4.30", "Pillow>=11", "pi-heif>=1.4", "opencv-python-headless>=4.10"]
web = ["fastapi>=0.162,<1", "uvicorn>=0.54,<1", "python-multipart>=0.0.33,<0.1", "httpx>=0.28,<1"]
ner = ["gliner>=0.2.30,<0.3", "torch>=2.7,<3", "transformers>=5.22,<6", "sentencepiece>=0.2.2,<0.3", "protobuf>=7.36,<8"]
ner-onnx = ["gliner>=0.2.30,<0.3", "torch>=2.7,<3", "transformers>=5.22,<6", "sentencepiece>=0.2.2,<0.3", "protobuf>=7.36,<8", "onnx>=1.23,<2", "onnxruntime>=1.31,<2", "onnxscript>=0.7,<0.8"]
desktop = ["PySide6==6.12.0; sys_platform == 'win32'"]
desktop-build = ["pyinstaller==6.22.3; sys_platform == 'win32'", "packaging>=24"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["anonymizer*"]

[tool.setuptools.package-data]
anonymizer = ["data/*.json", "data/*.txt", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
cache_dir = "build/cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "build/cache/ruff"
extend-exclude = ["tools/local", "tools/test-data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
